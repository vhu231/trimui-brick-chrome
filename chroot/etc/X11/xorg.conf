Section "Module"
    # Empty ATIFGLRXDRI extension: tells Chrome it may use a Vulkan swapchain,
    # which VK_LAYER_BRICK_x11_wsi provides (see vk-shim/brick_xext.c).
    Load "brickext"
EndSection
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "DontVTSwitch" "true"
EndSection
Section "Device"
    Identifier "BrickFramebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    # No shadow framebuffer: with it every frame is copied twice, and the copy
    # into /dev/fb0 cost Xorg 70% of a core while scrolling; without it, 8%.
    # Nothing here reads back from the screen, which is what the shadow is for.
    Option "ShadowFB" "false"
EndSection
Section "Monitor"
    Identifier "BrickLCD"
EndSection
Section "Screen"
    Identifier "BrickScreen"
    Device "BrickFramebuffer"
    Monitor "BrickLCD"
EndSection
Section "ServerLayout"
    Identifier "BrickLayout"
    Screen 0 "BrickScreen"
EndSection
